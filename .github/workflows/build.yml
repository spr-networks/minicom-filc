name: Build Fil-C Minicom

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify
        run: ./build.sh "${{ matrix.arch }}"
      - name: Package binaries and runtime
        run: ./package.sh "${{ matrix.arch }}"
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minicom-filc-linux-${{ matrix.arch }}
          path: |
            dist/minicom-filc-linux-${{ matrix.arch }}.tar.gz
            dist/minicom-filc-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/minicom-filc-linux-${{ matrix.arch }}.tar.gz
